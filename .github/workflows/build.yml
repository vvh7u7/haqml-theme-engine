name: Build HaThemeEngine for all platforms

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtqml qtquickcontrols2 qtcharts'

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build
      run: |
        cd build
        cmake --build . --config Release

    - name: Upload Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: HaThemeEngine-Windows
        path: build/Release/HaThemeEditor.exe

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt6
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.0'
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtqml qtquickcontrols2'

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}"

    - name: Build
      run: |
        cd build
        make

    - name: Upload macOS artifact
      uses: actions/upload-artifact@v4
      with:
        name: HaThemeEngine-macOS
        path: build/HaThemeEditor.app

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Qt6
      run: |
        sudo apt-get update
        sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake ..

    - name: Build
      run: |
        cd build
        make

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: HaThemeEngine-Linux
        path: build/editor/HaThemeEditor
