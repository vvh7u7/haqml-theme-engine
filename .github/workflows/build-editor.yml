name: Build and Package Theme Editor

on:
  push:
    branches: [ "main" ]
    paths:
      - 'editor/**'
      - 'CMakeLists.txt'
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'editor/**'

jobs:
  build:
    name: Theme Editor ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install latest CMake
        uses: lukka/get-cmake@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev libxkbcommon-x11-dev libglib2.0-dev libfontconfig1-dev libdbus-1-dev libxcb-cursor0 libicu-dev

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || '' }}
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -G Ninja -DBUILD_EDITOR=ON

      - name: Build project
        run: cmake --build build --config Release --parallel

      - name: Deploy Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir -p deploy
          Copy-Item -Path build/editor/ThemeEditor.exe -Destination deploy/ -Force
          windeployqt --release --no-compiler-runtime --qmldir editor/qml --dir deploy deploy/ThemeEditor.exe

      - name: Deploy macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p deploy
          if [ -d "build/editor/ThemeEditor.app" ]; then
            macdeployqt build/editor/ThemeEditor.app -qmldir=editor/qml -always-overwrite -verbose=1
            cp -R build/editor/ThemeEditor.app deploy/
          else
            echo "ERROR: ThemeEditor.app not found!"
            exit 1
          fi

      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p deploy
          echo "=== Checking where ThemeEditor is located ==="
          ls -la build/ || true
          ls -la build/editor/ || true
          
          if [ -f "build/ThemeEditor" ]; then
            cp build/ThemeEditor deploy/ThemeEditor
            echo "Found ThemeEditor in build/"
          elif [ -f "build/editor/ThemeEditor" ]; then
            cp build/editor/ThemeEditor deploy/ThemeEditor
            echo "Found ThemeEditor in build/editor/"
          else
            echo "ERROR: ThemeEditor binary not found anywhere!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haqml-theme-engine-${{ matrix.os }}
          path: deploy/
          if-no-files-found: error