name: Build Theme Editor

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Theme Editor ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install latest CMake
        uses: lukka/get-cmake@latest

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ninja-build build-essential libgl1-mesa-dev libxkbcommon-x11-dev libglib2.0-dev libfontconfig1-dev libdbus-1-dev libxcb-cursor0 libicu-dev

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          target: desktop
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || runner.os == 'macOS' && 'clang_64' || '' }}
          cache: true

      - name: Configure CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -G Ninja

      - name: Build project
        run: cmake --build build --config Debug --parallel

      - name: Deploy Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir -p deploy windeployqt --release --no-compiler-runtime --qmldir editor/qml --dir deploy build/editor/ThemeEditor.exe

      - name: Deploy macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p deploy
          macdeployqt build/editor/ThemeEditor.app -qmldir=editor/qml -always-overwrite -verbose=1 cp -R build/editor/ThemeEditor.app deploy/

      - name: Prepare Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p deploy
          cp build/editor/ThemeEditor deploy/ThemeEditor

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: haqml-theme-engine-${{ matrix.os }}
          path: deploy/
          if-no-files-found: error
